services:
  db:
    image: mysql:8.4
    container_name: telehealth-db
    restart: unless-stopped
    profiles:
      - dev
      - prod
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: telehealth_db
      MYSQL_USER: telehealth
      MYSQL_PASSWORD: telehealth123
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-dev:
    build:
      context: ./telehealth-backend
      dockerfile: Dockerfile
    container_name: telehealth-backend
    restart: unless-stopped
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: mysql://telehealth:telehealth123@db:3306/telehealth_db
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-SieuBaoMatTeleHealth2026}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-LocalTeleHealth2FAKey2026}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CASSO_WEBHOOK_SECRET: ${CASSO_WEBHOOK_SECRET:-}
      PAYMENT_BANK_ID: ${PAYMENT_BANK_ID:-}
      PAYMENT_ACCOUNT_NO: ${PAYMENT_ACCOUNT_NO:-}
      PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:-}
    ports:
      - "3000:3000"
    volumes:
      - ./telehealth-backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npm run start:dev"

  frontend-dev:
    build:
      context: ./telehealth-frontend
      dockerfile: Dockerfile
    container_name: telehealth-frontend
    restart: unless-stopped
    profiles:
      - dev
    depends_on:
      - backend-dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
      VITE_TURN_URL: ${VITE_TURN_URL:-}
      VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
      VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./telehealth-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  backend-prod:
    build:
      context: ./telehealth-backend
      dockerfile: Dockerfile
    container_name: telehealth-backend-prod
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
      DATABASE_URL: mysql://telehealth:telehealth123@db:3306/telehealth_db
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-SieuBaoMatTeleHealth2026}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-LocalTeleHealth2FAKey2026}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CASSO_WEBHOOK_SECRET: ${CASSO_WEBHOOK_SECRET:-}
      PAYMENT_BANK_ID: ${PAYMENT_BANK_ID:-}
      PAYMENT_ACCOUNT_NO: ${PAYMENT_ACCOUNT_NO:-}
      PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:-}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma generate && npm run build && npm run start:prod"

  frontend-prod:
    build:
      context: ./telehealth-frontend
      dockerfile: Dockerfile
    container_name: telehealth-frontend-prod
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      - backend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
      VITE_TURN_URL: ${VITE_TURN_URL:-}
      VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
      VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    ports:
      - "4173:4173"
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
